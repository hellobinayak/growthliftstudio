name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev \
            libxkbcommon-x11-0 \
            libgtk-3-0 \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxss1 \
            libasound2t64

      - name: Install Puppeteer
        run: npm install puppeteer --save-dev

      - name: Build
        run: npm run build
        
      - name: Pre-render pages with Puppeteer
        run: |
          npm install -g serve
          npx serve dist -p 5000 --single &
          sleep 8

          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            page.on('console', msg => console.log('BROWSER LOG:', msg.text()));
            page.on('pageerror', err => console.log('BROWSER ERROR:', err.message));
            page.on('requestfailed', req => console.log('FAILED REQUEST:', req.url()));
            await page.goto('http://localhost:5000/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            await new Promise(r => setTimeout(r, 5000));
            const rootLength = await page.evaluate(() => document.getElementById('root').innerHTML.length);
            console.log('Root length after 5s:', rootLength);
            const html = await page.content();
            console.log('Body snippet:', html.substring(html.indexOf('<body'), html.indexOf('<body') + 500));
            await browser.close();
          })();
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
