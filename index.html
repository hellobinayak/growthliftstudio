        },

            "text": "We work best with solo contractors and small teams of 6–10 crew members in bathroom remodeling, kitchen remodeling, or window replacement. Contractors who have tried paid ads before but didn't get results are a strong fit — we have 6 years of experience fixing underperforming campaigns."
